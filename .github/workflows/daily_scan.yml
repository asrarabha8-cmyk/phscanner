name: Daily Phoenix Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Streamlit secrets
        env:
          GH_TOKEN_SECRET: ${{ secrets.PAT_TOKEN }}
          POLY_KEY_SECRET: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p .streamlit
          python3 - <<'PYEOF'
          import json, os
          with open(".streamlit/secrets.toml", "w") as f:
              f.write("GITHUB_TOKEN = " + json.dumps(os.environ["GH_TOKEN_SECRET"]) + "\n")
              f.write("POLYGON_API_KEY = " + json.dumps(os.environ["POLY_KEY_SECRET"]) + "\n")
          PYEOF

      - name: Run scan
        run: python run_scan.py
