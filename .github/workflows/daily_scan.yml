name: Daily Phoenix Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Streamlit secrets
        env:
          GH_TOKEN_SECRET: ${{ secrets.PAT_TOKEN }}
          POLY_KEY_SECRET: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p .streamlit
          printf "GITHUB_TOKEN = '%s'\n" "$GH_TOKEN_SECRET" > .streamlit/secrets.toml
          printf "POLYGON_API_KEY = '%s'\n" "$POLY_KEY_SECRET" >> .streamlit/secrets.toml

      - name: Run scan
        run: python run_scan.py
