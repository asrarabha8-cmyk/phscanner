name: Noise Band Backtest

on:
  push:
    branches: [noise-band-bt]
    paths:
      - research/noise_band/backtest.py
      - .github/workflows/noise_band_backtest.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests

      - name: Run backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/noise_band/backtest.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/noise_band
          git diff --cached --quiet || git commit -m "Add Noise Band backtest results"
          git push
