name: Momentum Filter Test

on:
  push:
    branches: [momentum-filter-bt]
    paths:
      - research/momentum_filter/filter_test.py
      - .github/workflows/momentum_filter.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/momentum_filter/filter_test.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/momentum_filter
          git diff --cached --quiet || git commit -m "Add momentum filter results"
          git pull --rebase origin momentum-filter-bt && git push origin HEAD:momentum-filter-bt
