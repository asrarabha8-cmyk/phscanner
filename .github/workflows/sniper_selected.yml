name: Sniper Selected Stocks

on:
  push:
    branches: [sniper-selected-bt]
    paths:
      - research/sniper_selected/selected_test.py
      - .github/workflows/sniper_selected.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests

      - name: Run test
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/sniper_selected/selected_test.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/sniper_selected
          git diff --cached --quiet || git commit -m "Add selected stocks results"
          git push
