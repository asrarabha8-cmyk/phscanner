name: SPY 0DTE Options Data

on:
  push:
    branches: [spy-0dte-backtest]
    paths: ["backtests/spy_0dte/fetch_options.py", "backtests/spy_0dte/data/options/.continue"]

permissions:
  contents: write

concurrency:
  group: spy-options-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spy-0dte-backtest
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Fetch options
        working-directory: backtests/spy_0dte
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python fetch_options.py 2>&1 | tail -50 > data/options_log.txt || true
          git add data/options_log.txt; git commit -q -m "options log [skip ci]" && git pull -q --rebase && git push -q || true
