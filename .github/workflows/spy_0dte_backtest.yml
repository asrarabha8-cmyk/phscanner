name: SPY 0DTE Backtest

on:
  workflow_dispatch: {}
  push:
    branches: [spy-0dte-backtest]
    paths: ["backtests/spy_0dte/**", ".github/workflows/spy_0dte_backtest.yml"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scipy matplotlib requests tabulate
      - name: Run backtest
        working-directory: backtests/spy_0dte
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python spy_0dte_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: spy-0dte-results
          path: |
            backtests/spy_0dte/spy_0dte_summary.csv
            backtests/spy_0dte/spy_0dte_trades.csv
            backtests/spy_0dte/spy_0dte_equity.png
