name: Candle Rejection Backtest

on:
  push:
    branches: [candle-rejection-bt]
    paths:
      - research/candle_rejection/candle_test.py
      - .github/workflows/candle_rejection_backtest.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests

      - name: Run backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/candle_rejection/candle_test.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/candle_rejection
          git diff --cached --quiet || git commit -m "Add candle rejection backtest results"
          git push
