name: SPY 0DTE 1m Test

on:
  push:
    branches: [spy-0dte-1m]
    paths:
      - research/spy_0dte_1m/orb_1m.py
      - .github/workflows/spy_0dte_1m.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spy-0dte-1m
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pandas numpy requests
      - name: Fetch contracts
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MODE: fetch
        run: python research/spy_0dte_1m/orb_1m.py
      - name: Save cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/spy_0dte_1m/cache.json || true
          git diff --cached --quiet || git commit -m "Add 1-minute option bars"
          git pull --rebase origin spy-0dte-1m && git push origin HEAD:spy-0dte-1m

  analyze:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin spy-0dte-1m
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pandas numpy requests
      - name: Analyze
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/spy_0dte_1m/orb_1m.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/spy_0dte_1m
          git diff --cached --quiet || git commit -m "Add SPY 0DTE 1-minute results"
          git pull --rebase origin spy-0dte-1m && git push origin HEAD:spy-0dte-1m
