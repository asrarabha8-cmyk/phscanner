name: Post-earnings Drift Test

on:
  push:
    branches: [pead-bt]
    paths:
      - research/pead/pead_test.py
      - .github/workflows/pead.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/pead/pead_test.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/pead
          git diff --cached --quiet || git commit -m "Add post-earnings drift results"
          git pull --rebase origin pead-bt && git push origin HEAD:pead-bt
